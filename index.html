/*

*/
const SUPABASE_URL = "https://mjghjilrxykchsxbhsvr.supabase.co";
const SUPABASE_KEY = "sb_publishable_UNiq5gu_9qSWhc845td6BQ_TNLUA7VE";
const supabaseClient = (SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") &&
                        SUPABASE_KEY && !SUPABASE_KEY.includes("PASTE_"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

async function saveQuizResultOnline(result) {
    if (!supabaseClient) return { ok: false, reason: "not_configured" };

    const payload = {
        nis: String(result.nis || "").trim(),
        nama: String(result.nama || "").trim(),
        mapel: result.mapel || "PKWU",
        materi: result.materi || "Wirausaha Kerajinan - Perencanaan Usaha Kerajinan",
        kelas: result.kelas || "X / Fase E",
        skor: Number(result.skor || 0),
        dekomposisi: Number(result.dekomposisi || 0),
        pola: Number(result.pola || 0),
        abstraksi: Number(result.abstraksi || 0),
        algoritma: Number(result.algoritma || 0),
        waktu: result.waktu || new Date().toISOString()
    };

    try {
        const { data: existing, error: findError } = await supabaseClient
            .from("hasil_kuis_bk")
            .select("id, nis")
            .eq("nis", payload.nis)
            .limit(1);

        if (findError) return { ok: false, reason: findError.message };

        let error = null;
        if (Array.isArray(existing) && existing.length > 0) {
            const id = existing[0].id;
            const response = await supabaseClient.from("hasil_kuis_bk").update(payload).eq("id", id);
            error = response.error;
        } else {
            const response = await supabaseClient.from("hasil_kuis_bk").insert(payload);
            error = response.error;
        }

        if (error) return { ok: false, reason: error.message };
        return { ok: true };
    } catch (err) {
        return { ok: false, reason: err?.message || String(err) };
    }
}
</script>

        let currentUser = null;

        const QUIZ_DURATION_MS = 60 * 60 * 1000;

        let tabGuardChannel = null;

        function activeSessionKey() { return 'pkwu_quiz_active_session_v1'; }
        function needsTeacherResetKey(nis) { return `pkwu_quiz_needs_teacher_reset_${String(nis).trim()}`; }
        function resetAuthorizedKey(nis) { return `pkwu_quiz_reset_authorized_${String(nis).trim()}`; }

        function setupSecurityGuards() {
            if ('BroadcastChannel' in window) {
                tabGuardChannel = new BroadcastChannel('pkwu_quiz_guard_channel');
                tabGuardChannel.onmessage = (event) => {
                    if (event.data && event.data.type === 'FORCE_LOGOUT') {
                        forceAutoLogout("Terdeteksi membuka tab baru atau sesi aktif di tempat lain.");
                    }
                };
            }

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden' && currentUser) {
                    forceAutoLogout("Sesi diakhiri otomatis karena Anda keluar dari halaman ulangan atau membuka tab lain.");
                }
            });

            window.addEventListener('pagehide', () => {
                if (currentUser) {
                    forceAutoLogout("Sesi ditutup.");
                }
            });
        }

        function forceAutoLogout(reason) {
            if (!currentUser) return;
            const nis = String(currentUser.nis);
            
            try {
                localStorage.setItem(needsTeacherResetKey(nis), JSON.stringify({ reason, at: new Date().toISOString() }));
                localStorage.removeItem(activeSessionKey());
            } catch (e) {}

            if (tabGuardChannel) {
                tabGuardChannel.postMessage({ type: 'FORCE_LOGOUT', nis });
            }

            currentUser = null;
            stopQuizTimer();
            
            const loginModal = document.getElementById('login-modal');
            const errorBox = document.getElementById('login-error');
            const userBadge = document.getElementById('user-badge');
            
            if (loginModal) loginModal.classList.remove('hidden');
            if (userBadge) {
                userBadge.classList.add('hidden');
                userBadge.classList.remove('flex');
            }
            if (errorBox) {
                errorBox.textContent = `⚠️ ${reason} Silakan minta guru mereset akses jika ingin masuk kembali.`;
                errorBox.classList.remove('hidden');
            }
        }

        async function hasCompletedAttempt(nis) {
            const normalizedNis = String(nis).trim();
            try {
                if (localStorage.getItem(resetAuthorizedKey(normalizedNis)) === '1') return false;
                if (localStorage.getItem(needsTeacherResetKey(normalizedNis))) return true;
            } catch (e) {}

            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from("hasil_kuis_bk")
                        .select("nis")
                        .eq("nis", normalizedNis)
                        .limit(1);
                    if (!error && Array.isArray(data) && data.length > 0) return true;
                } catch (e) {}
            }
            return false;
        }

        function startQuizTimer() {
            stopQuizTimer();
            if (!currentUser) return;
            const key = `pkwu_quiz_deadline_${currentUser.nis}`;
            let storedDeadline = 0;
            try { storedDeadline = Number(localStorage.getItem(key) || 0); } catch (e) {}
            quizDeadline = storedDeadline > 0 ? storedDeadline : Date.now() + QUIZ_DURATION_MS;
            try { if (!storedDeadline) localStorage.setItem(key, String(quizDeadline)); } catch (e) {}
            
            updateQuizTimer();
            quizTimerInterval = setInterval(updateQuizTimer, 1000);
        }

        function stopQuizTimer() {
            if (quizTimerInterval) clearInterval(quizTimerInterval);
            quizTimerInterval = null;
        }

        function updateQuizTimer() {
            if (!quizDeadline || !currentUser) return;
            const remaining = Math.max(0, quizDeadline - Date.now());
            const totalSeconds = Math.ceil(remaining / 1000);
            const mm = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const ss = String(totalSeconds % 60).padStart(2, '0');
            const timer = document.getElementById('quiz-timer');
            if (timer) timer.textContent = `${mm}:${ss}`;
            if (remaining <= 0) forceAutoLogout("Waktu ulangan telah habis.");
        }

                localStorage.removeItem(resetAuthorizedKey(foundStudent.nis));

        let teacherResultsCache = [];
        async function loadTeacherDashboard() {
            let combined = studentDatabase.map(s => ({ nis: s.nis, nama: s.nama, skor: null }));
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from("hasil_kuis_bk").select("*");
                    if (Array.isArray(data)) {
                        data.forEach(row => {
                            const idx = combined.findIndex(s => s.nis === row.nis);
                            if (idx >= 0) combined[idx] = { ...combined[idx], ...row };
                        });
                    }
                } catch (e) {}
            }
            teacherResultsCache = combined;
            renderTeacherTable(combined);
        }

        function renderTeacherTable(results) {
            const tbody = document.getElementById('teacher-results-tbody');
            tbody.innerHTML = '';
            results.forEach((r, i) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/50">
                        <td class="px-4 py-3 text-slate-400">${i + 1}</td>
                        <td class="px-4 py-3 font-semibold text-white">${r.nama}</td>
                        <td class="px-4 py-3 font-mono text-slate-400">${r.nis}</td>
                        <td class="px-4 py-3 text-center font-bold text-tech-400">${r.skor !== null ? r.skor : '—'}</td>
                        <td class="px-4 py-3 text-center"><button type="button" onclick="resetStudentAttempt('${r.nis}')" class="px-3 py-1 rounded bg-amber-500 text-slate-950 font-bold text-xs">Reset Akses</button></td>
                    </tr>
                `;
            });
        }

        // FUNGSI RESET YANG DIPERBAIKI (MEMBERSIHKAN LOKAL DAN ONLINE SUPABASE)
        async function resetStudentAttempt(nis) {
            const cleanNis = String(nis || "").trim();
            const student = studentDatabase.find(s => String(s.nis).trim() === cleanNis);
            
            if (!student) { 
                alert('Data siswa dengan NISN tersebut tidak ditemukan.'); 
                return; 
            }
            
            if (!confirm(`Reset akses ulangan untuk ${student.nama} (${cleanNis})? Siswa akan diizinkan login kembali.`)) {
                return;
            }
            
            try {
                // 1. Bersihkan seluruh penanda sesi & penguncian lokal
                localStorage.removeItem(`pkwu_quiz_completed_${cleanNis}`);
                localStorage.removeItem(needsTeacherResetKey(cleanNis));
                localStorage.removeItem(`pkwu_quiz_tab_violation_${cleanNis}`);
                localStorage.removeItem(`pkwu_quiz_deadline_${cleanNis}`);
                localStorage.setItem(resetAuthorizedKey(cleanNis), '1');
                
                const active = JSON.parse(localStorage.getItem(activeSessionKey()) || 'null');
                if (active && String(active.nis).trim() === cleanNis) {
                    localStorage.removeItem(activeSessionKey());
                }

                // 2. Hapus data nilai secara online di Supabase
                if (supabaseClient) {
                    const { error } = await supabaseClient
                        .from("hasil_kuis_bk")
                        .delete()
                        .eq("nis", cleanNis);

                    if (error) {
                        console.warn("Gagal menghapus data online di Supabase:", error.message);
                    }
                }

                alert(`Akses ulangan ${student.nama} berhasil direset! Siswa dapat login kembali.`);
                loadTeacherDashboard();
            } catch (e) {
                alert('Gagal mereset: ' + (e.message || e));
            }
        }

        const quizQuestions = [
            { question: "Seorang siswa membuat kerajinan dari bahan limbah...", options: ["A", "B", "C", "D", "E"], correct: 1 }
        ];
        let currentQuizIndex = 0, quizScore = 0, selectedQuizOption = null;

        function initQuiz() {
            currentQuizIndex = 0; quizScore = 0; selectedQuizOption = null;
            renderQuizQuestion();
        }
        function renderQuizQuestion() {
            document.getElementById('quiz-question-text').innerText = quizQuestions[currentQuizIndex].question;
            const c = document.getElementById('quiz-options-container'); c.innerHTML = '';
            ["Opsi A", "Opsi B", "Opsi C", "Opsi D"].forEach((opt, i) => {
                c.innerHTML += `<button onclick="selectQuizOption(${i}, this)" class="w-full text-left p-4 rounded-xl border border-slate-200">${opt}</button>`;
            });
        }
        function selectQuizOption(i, el) {
            selectedQuizOption = i;
            document.querySelectorAll('#quiz-options-container button').forEach(b => b.classList.remove('border-amber-500'));
            el.classList.add('border-amber-500');
            document.getElementById('btn-quiz-submit').disabled = false;
        }
        function submitQuizAnswer() {
            quizScore = 100;
            showQuizResults();
        }
        async function showQuizResults() {
            stopQuizTimer();
            if (currentUser) {
                try {
                    await saveQuizResultOnline({ nis: currentUser.nis, nama: currentUser.nama, skor: quizScore });
                } catch (e) {}
            }
            document.getElementById('quiz-question-box').classList.add('hidden');
            document.getElementById('quiz-action-bar').classList.add('hidden');
            document.getElementById('quiz-result-dashboard').classList.remove('hidden');
            document.getElementById('final-score-val').innerText = quizScore;
        }
        function restartQuiz() { initQuiz(); startQuizTimer(); }

        window.addEventListener('DOMContentLoaded', () => {
            setupSecurityGuards();
            initQuiz();
        });
    </script>
</body>
</html>
